name: Publish to PSGallery

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test-before-publish:
    name: Sanity Tests Before Publishing
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest tests/ --tb=short

      - name: Install Pester
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck

      - name: Run Pester tests
        shell: powershell
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/powershell"
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  publish-psgallery:
    name: Publish to PowerShell Gallery
    runs-on: windows-latest
    needs: test-before-publish
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: get-version
        shell: powershell
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/v", "")
          Write-Host "Version: $tag"
          echo "VERSION=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check PSGallery for existing version
        id: check-version
        shell: powershell
        env:
          NEW_VERSION: ${{ steps.get-version.outputs.VERSION }}
        run: |
          $localVersion = [version]$env:NEW_VERSION
          Write-Host "Local version: $localVersion"

          # Query PSGallery for current version
          $psGalleryUrl = "https://www.powershellgallery.com/api/v2/FindPackagesById()?id='BATCRelayBot'"
          try {
            $response = Invoke-RestMethod -Uri $psGalleryUrl -ErrorAction Stop
            if ($response.entry) {
              $latestVersion = $response.entry[0].properties.Version | Sort-Object -Version -Descending | Select-Object -First 1
              Write-Host "Latest PSGallery version: $latestVersion"

              if ([version]$latestVersion -ge $localVersion) {
                Write-Error "Version $localVersion already exists on PSGallery or is older than $latestVersion. Please bump the version in BATCRelayBot.psd1"
                exit 1
              }
              Write-Host "✓ Version check passed - $localVersion is newer than PSGallery version $latestVersion" -ForegroundColor Green
            } else {
              Write-Host "No existing version found on PSGallery (first publish)" -ForegroundColor Green
            }
          } catch {
            Write-Host "⚠️  Could not query PSGallery (might be first publish): $_" -ForegroundColor Yellow
          }

      - name: Publish module to PSGallery
        shell: powershell
        run: |
          $modulePath = "BATCRelayBot"
          $apiKey = "${{ secrets.PSGALLERY_API_KEY }}"

          if (-not $apiKey) {
            Write-Error "PSGALLERY_API_KEY secret not set!"
            exit 1
          }

          Publish-Module -Path $modulePath -NuGetApiKey $apiKey -Force
          Write-Host "Successfully published version ${{ steps.get-version.outputs.VERSION }} to PSGallery" -ForegroundColor Green

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get-version.outputs.VERSION }}"
          RELEASE_TAG="v${VERSION}"

          # Create release notes
          RELEASE_NOTES=$(cat <<'NOTES'
          # BATC Relay Bot v${{ steps.get-version.outputs.VERSION }}

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ## Installation

          ```powershell
          Install-Module BATCRelayBot -Repository PSGallery
          ```
          NOTES
          )

          # Try to create release, ignore if it already exists
          gh release create "${RELEASE_TAG}" \
            --title "Release v${VERSION}" \
            --notes "${RELEASE_NOTES}" \
            --draft=false \
            --prerelease=false || echo "Release ${RELEASE_TAG} already exists (OK)"
