name: Publish to PSGallery

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test-before-publish:
    name: Sanity Tests Before Publishing
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          test -f requirements.txt && pip install -r requirements.txt || echo "No requirements.txt found"
          pip install pytest pytest-asyncio

      - name: Run pytest
        run: |
          pytest tests/ --tb=short

      - name: Install Pester
        shell: powershell
        run: |
          # The runner image normally ships Pester 5, so only reach for
          # PSGallery when it does not. A bare Install-Module has failed on a
          # runner with "No match was found ... module name 'Pester'", which
          # is PSGallery being unreachable, untrusted, or the NuGet provider
          # missing - and it took the whole test job down with it.
          $existing = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'5.0' } |
            Sort-Object Version -Descending | Select-Object -First 1

          if ($existing) {
            Write-Host "Using preinstalled Pester $($existing.Version)"
            return
          }

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Get-PackageProvider -Name NuGet -ForceBootstrap | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Host "Attempt ${attempt} failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 15
            }
          }

      - name: Run Pester tests
        shell: powershell
        run: |
          # The gate in front of a PSGallery publish has to be at least as
          # strict as the one on every push. This ran "tests/powershell" - 26
          # module smoke tests - so a release could pass it with the whole
          # unit and integration suite failing.
          Import-Module Pester -MinimumVersion 5.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = "tests"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Normal"
          Invoke-Pester -Configuration $config

  publish-psgallery:
    name: Publish to PowerShell Gallery
    runs-on: windows-latest
    needs: test-before-publish
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: get-version
        shell: powershell
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/v", "")
          Write-Host "Version: $tag"
          echo "VERSION=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check PSGallery for existing version
        id: check-version
        shell: bash
        env:
          NEW_VERSION: ${{ steps.get-version.outputs.VERSION }}
        run: |
          echo "Checking PSGallery for existing version..."
          echo "Local version: $NEW_VERSION"

          # Query PSGallery API for current version (returns OData/Atom XML)
          RESPONSE=$(curl -s "https://www.powershellgallery.com/api/v2/FindPackagesById()?id='BATCRelayBot'")

          # Extract all versions from XML (format: <d:Version>X.Y.Z</d:Version>)
          VERSIONS=$(echo "$RESPONSE" | grep -oP '<d:Version>\K[^<]+' | sort -V | tail -1)

          if [ -z "$VERSIONS" ]; then
            echo "⚠️  Could not determine latest version from PSGallery API"
            echo "Proceeding with publish as first release..."
            exit 0
          fi

          LATEST=$VERSIONS
          echo "Latest PSGallery version: $LATEST"
          echo "Local version: $NEW_VERSION"

          # Proper version comparison using sort -V (semantic versioning)
          if [ "$(printf '%s\n' "$LATEST" "$NEW_VERSION" | sort -V | head -n1)" = "$LATEST" ] && [ "$LATEST" != "$NEW_VERSION" ]; then
            echo "✓ Version check passed - $NEW_VERSION is newer than PSGallery version $LATEST"
            exit 0
          else
            echo "❌ Version $NEW_VERSION is not newer than PSGallery version $LATEST"
            echo "Please bump the version in BATCRelayBot.psd1"
            exit 1
          fi

      - name: Publish module to PSGallery
        if: success()
        shell: powershell
        run: |
          $modulePath = "BATCRelayBot"
          $apiKey = "${{ secrets.PSGALLERY_API_KEY }}"

          if (-not $apiKey) {
            Write-Error "PSGALLERY_API_KEY secret not set!"
            exit 1
          }

          # Publish-Module packages the module folder and nothing above it, so
          # bot.py, requirements.txt and config.example.json - which live in the
          # repository root - were absent from every package up to and including
          # 1.4.0. Install-BATCRelayBot then stopped with "requirements.txt not
          # found" before writing anything, and the version was unusable from the
          # gallery. Local runs never showed it: the installer's relative-path
          # fallbacks find the files in a checkout.
          #
          # They are copied in here rather than moved in the repository, because
          # the installer already searches its own module directory and moving
          # them would touch paths in tests, docs and the bot's working
          # directory. Keep this list in step with Test-InstallerPayload.
          $payload = 'bot.py', 'requirements.txt', 'config.example.json'
          foreach ($file in $payload) {
            if (-not (Test-Path $file)) {
              Write-Error "$file is missing from the repository root - the package would be unusable"
              exit 1
            }
            Copy-Item -Path $file -Destination $modulePath -Force
            Write-Host "  packaged $file"
          }

          Publish-Module -Path $modulePath -NuGetApiKey $apiKey -Force
          Write-Host "Successfully published version ${{ steps.get-version.outputs.VERSION }} to PSGallery" -ForegroundColor Green

      - name: Create GitHub Release
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get-version.outputs.VERSION }}"
          RELEASE_TAG="v${VERSION}"

          # Create release notes
          RELEASE_NOTES=$(cat <<'NOTES'
          # BATC Relay Bot v${{ steps.get-version.outputs.VERSION }}

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ## Installation

          ```powershell
          Install-Module BATCRelayBot -Repository PSGallery
          ```
          NOTES
          )

          # Try to create release, ignore if it already exists
          gh release create "${RELEASE_TAG}" \
            --title "Release v${VERSION}" \
            --notes "${RELEASE_NOTES}" \
            --draft=false \
            --prerelease=false || echo "Release ${RELEASE_TAG} already exists (OK)"
