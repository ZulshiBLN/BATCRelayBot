name: Publish to PSGallery

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test-before-publish:
    name: Sanity Tests Before Publishing
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Run pytest
        run: |
          pytest tests/ --tb=short

      - name: Install Pester
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck

      - name: Run Pester tests
        shell: powershell
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/powershell"
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  publish-psgallery:
    name: Publish to PowerShell Gallery
    runs-on: windows-latest
    needs: test-before-publish
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: get-version
        shell: powershell
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/v", "")
          Write-Host "Version: $tag"
          echo "VERSION=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check PSGallery for existing version
        id: check-version
        shell: bash
        env:
          NEW_VERSION: ${{ steps.get-version.outputs.VERSION }}
        run: |
          echo "Checking PSGallery for existing version..."
          echo "Local version: $NEW_VERSION"

          # Query PSGallery API for current version (returns OData/Atom XML)
          RESPONSE=$(curl -s "https://www.powershellgallery.com/api/v2/FindPackagesById()?id='BATCRelayBot'")

          # Extract all versions from XML (format: <d:Version>X.Y.Z</d:Version>)
          VERSIONS=$(echo "$RESPONSE" | grep -oP '<d:Version>\K[^<]+' | sort -V | tail -1)

          if [ -z "$VERSIONS" ]; then
            echo "⚠️  Could not determine latest version from PSGallery API"
            echo "Proceeding with publish as first release..."
            exit 0
          fi

          LATEST=$VERSIONS
          echo "Latest PSGallery version: $LATEST"
          echo "Local version: $NEW_VERSION"

          # Proper version comparison using sort -V (semantic versioning)
          if [ "$(printf '%s\n' "$LATEST" "$NEW_VERSION" | sort -V | head -n1)" = "$LATEST" ] && [ "$LATEST" != "$NEW_VERSION" ]; then
            echo "✓ Version check passed - $NEW_VERSION is newer than PSGallery version $LATEST"
            exit 0
          else
            echo "❌ Version $NEW_VERSION is not newer than PSGallery version $LATEST"
            echo "Please bump the version in BATCRelayBot.psd1"
            exit 1
          fi

      - name: Publish module to PSGallery
        if: success()
        shell: powershell
        run: |
          $modulePath = "BATCRelayBot"
          $apiKey = "${{ secrets.PSGALLERY_API_KEY }}"

          if (-not $apiKey) {
            Write-Error "PSGALLERY_API_KEY secret not set!"
            exit 1
          }

          Publish-Module -Path $modulePath -NuGetApiKey $apiKey -Force
          Write-Host "Successfully published version ${{ steps.get-version.outputs.VERSION }} to PSGallery" -ForegroundColor Green

      - name: Create GitHub Release
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get-version.outputs.VERSION }}"
          RELEASE_TAG="v${VERSION}"

          # Create release notes
          RELEASE_NOTES=$(cat <<'NOTES'
          # BATC Relay Bot v${{ steps.get-version.outputs.VERSION }}

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ## Installation

          ```powershell
          Install-Module BATCRelayBot -Repository PSGallery
          ```
          NOTES
          )

          # Try to create release, ignore if it already exists
          gh release create "${RELEASE_TAG}" \
            --title "Release v${VERSION}" \
            --notes "${RELEASE_NOTES}" \
            --draft=false \
            --prerelease=false || echo "Release ${RELEASE_TAG} already exists (OK)"
