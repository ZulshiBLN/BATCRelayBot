name: Publish to PSGallery

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test-before-publish:
    name: Sanity Tests Before Publishing
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest tests/ --tb=short

      - name: Install Pester
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck

      - name: Run Pester tests
        shell: powershell
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/powershell"
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  publish-psgallery:
    name: Publish to PowerShell Gallery
    runs-on: windows-latest
    needs: test-before-publish
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: get-version
        shell: powershell
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/v", "")
          Write-Host "Version: $tag"
          echo "VERSION=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish module to PSGallery
        shell: powershell
        run: |
          $modulePath = "BATCRelayBot"
          $apiKey = "${{ secrets.PSGALLERY_API_KEY }}"

          if (-not $apiKey) {
            Write-Error "PSGALLERY_API_KEY secret not set!"
            exit 1
          }

          Publish-Module -Path $modulePath -NuGetApiKey $apiKey -Force
          Write-Host "Successfully published version ${{ steps.get-version.outputs.VERSION }} to PSGallery" -ForegroundColor Green

      - name: Create Release Notes
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get-version.outputs.VERSION }}
          body: |
            # BATC Relay Bot v${{ steps.get-version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Installation

            ```powershell
            Install-Module BATCRelayBot -Repository PSGallery
            ```
          draft: false
          prerelease: false
