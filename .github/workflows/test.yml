name: Tests

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  python-tests:
    name: Python Tests (pytest)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          test -f requirements.txt && pip install -r requirements.txt || echo "No requirements.txt found"

      - name: Run pytest with coverage
        run: |
          pytest tests/ --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false

  powershell-tests:
    name: PowerShell Tests (Pester)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PowerShell
        shell: powershell
        run: |
          $PSVersionTable.PSVersion

      - name: Install Pester
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck

      - name: Run Pester tests
        shell: powershell
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/powershell"
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $false
          Invoke-Pester -Configuration $config

  lint:
    name: Code Quality Checks
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install pylint flake8 black mypy

      - name: Run pylint
        shell: bash
        run: |
          pylint bot.py --exit-zero --fail-under=8.0 || exit 0

      - name: Run flake8
        shell: bash
        run: |
          flake8 bot.py --max-line-length=120 --exit-zero || exit 0

      - name: Check formatting with black
        shell: bash
        run: |
          black --check bot.py || exit 0

      - name: Run mypy type checking
        shell: bash
        run: |
          mypy bot.py --ignore-missing-imports --exit-code 0 || exit 0
