[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-config=.coveragerc
    -v
asyncio_mode = auto

[coverage:run]
omit =
    tests/*
    setup.py
    */site-packages/*

[coverage:report]
fail_under = 80
precision = 2
